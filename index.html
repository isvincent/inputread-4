<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注音輸入唸讀機</title>
<style>
  /* 一個單位 u = 畫面寬度的 1%（16:9 時 = 高度的 1.778%），所有尺寸依此縮放，適合教室大型觸控螢幕 */
  :root {
    --z: 1;
    --dev: 1; --base: min(1vw, 1.778vh);
    --u: max(calc(var(--base) * var(--z) * var(--dev)), 6px);
    color-scheme: light;
    --bg: #f3efe4; --card: #ffffff; --ink: #161616; --muted: #3f3b34; --line: #8a8477;
    --accent: #9a3412; --accent-ink: #ffffff; --focus: #1d4ed8; --focus2: #ffffff;
    --k-init: #fde7c8; --k-init-b: #9a5a06;
    --k-med: #cdeee9; --k-med-b: #0b6b62;
    --k-fin: #d8e5fc; --k-fin-b: #1d4ed8;
    --k-tone: #e8dcfa; --k-tone-b: #6d28d9;
    --k-act: #e9e6dd; --k-act-b: #4a463e;
    --err: #9b1c1c; --ok: #0b5d3b;
  }
  :root[data-layout="portrait"] { --base: min(2.2vw, 1.25vh); }
  :root[data-device="phone"] { --dev: 1.3; }

  /* 暗色：跟隨系統或手動選擇 */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1b1a17; --card: #262521; --ink: #f2eee4; --muted: #d2ccbc; --line: #8f8a7d;
    --accent: #f97316; --accent-ink: #1a1a1a; --focus: #7db4ff; --focus2: #000;
    --k-init: #5a3a10; --k-init-b: #f0b35a;
    --k-med: #0f4a44; --k-med-b: #4fd6c4;
    --k-fin: #1e3a6e; --k-fin-b: #7fb0ff;
    --k-tone: #45286f; --k-tone-b: #c3a4ff;
    --k-act: #33312b; --k-act-b: #b8b2a2;
    --err: #ff9a9a; --ok: #7dffb0;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      color-scheme: dark;
      --bg: #1b1a17; --card: #262521; --ink: #f2eee4; --muted: #d2ccbc; --line: #8f8a7d;
      --accent: #f97316; --accent-ink: #1a1a1a; --focus: #7db4ff; --focus2: #000;
      --k-init: #5a3a10; --k-init-b: #f0b35a;
      --k-med: #0f4a44; --k-med-b: #4fd6c4;
      --k-fin: #1e3a6e; --k-fin-b: #7fb0ff;
      --k-tone: #45286f; --k-tone-b: #c3a4ff;
      --k-act: #33312b; --k-act-b: #b8b2a2;
      --err: #ff9a9a; --ok: #7dffb0;
    }
  }

  :root[data-contrast="high"] {
    --bg: #000; --card: #000; --ink: #fff; --muted: #fff; --line: #fff;
    --accent: #ffe600; --accent-ink: #000; --focus: #00e5ff; --focus2: #000;
    --k-init: #000; --k-init-b: #ffb000;
    --k-med: #000; --k-med-b: #00ffd0;
    --k-fin: #000; --k-fin-b: #6cb6ff;
    --k-tone: #000; --k-tone-b: #ff8cff;
    --k-act: #000; --k-act-b: #fff;
    --err: #ff8a8a; --ok: #7dffb0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    font-size: max(calc(var(--u) * 1.15), 16px); line-height: 1.5;
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  :focus { outline: none; }
  :focus-visible { outline: calc(var(--u) * .3) solid var(--focus); outline-offset: calc(var(--u) * .15); box-shadow: 0 0 0 calc(var(--u) * .5) var(--focus2); position: relative; z-index: 2; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 4px; top: -100px; background: var(--accent); color: var(--accent-ink); padding: .5em 1em; z-index: 10; border-radius: .4em; }
  .skip:focus { top: 4px; left: 4px; }

  /* 標題列 */
  header.top { display: flex; align-items: center; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * .55) calc(var(--u) * 2); border-bottom: 2px solid var(--line); flex-wrap: wrap; }
  header.top h1 { font-size: calc(var(--u) * 2.2); margin: 0; line-height: 1.2; }
  header.top .grow { flex: 1; }
  .tbtn { min-height: calc(var(--u) * 3.1); min-width: calc(var(--u) * 3.1); padding: 0 calc(var(--u) * 1.2); border-radius: calc(var(--u) * .8); border: 2px solid var(--line); background: var(--card); }
  .tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: calc(var(--u) * .8) calc(var(--u) * 2) calc(var(--u) * 1); gap: calc(var(--u) * .8); }

  /* 上半部：輸入顯示 + 結果 */
  .display { flex: 1; min-height: calc(var(--u) * 17); display: grid; grid-template-columns: minmax(0, 27fr) minmax(0, 73fr); gap: calc(var(--u) * 1.2); }
  .panel { background: var(--card); border: 2px solid var(--line); border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1) calc(var(--u) * 1.2); min-height: 0; display: flex; flex-direction: column; }
  .panel h2 { font-size: calc(var(--u) * 1.15); margin: 0 0 calc(var(--u) * .5); color: var(--muted); font-weight: 700; }

  .buffer { display: flex; gap: calc(var(--u) * .6); align-items: center; flex-wrap: wrap; min-height: calc(var(--u) * 5.4); }
  .sym { min-width: calc(var(--u) * 4.4); height: calc(var(--u) * 5.2); padding: 0 calc(var(--u) * .6); display: inline-flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 3.2); border-radius: calc(var(--u) * .8); border: 3px solid; background: var(--card); }
  .sym.i { border-color: var(--k-init-b); } .sym.m { border-color: var(--k-med-b); } .sym.f { border-color: var(--k-fin-b); }
  .hint { color: var(--muted); font-size: calc(var(--u) * 1.15); }

  .speech-mini { margin-top: auto; display: flex; flex-direction: column; gap: calc(var(--u) * .5); }
  .status { min-height: 3em; color: var(--muted); font-size: calc(var(--u) * 1.1); line-height: 1.4; }
  .status.warn { color: var(--err); font-weight: 700; }
  .status.ok { color: var(--ok); }

  .result { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: calc(var(--u) * .8); padding: calc(var(--u) * .3); }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .zy { font-size: calc(var(--u) * 1.35); color: var(--muted); white-space: nowrap; line-height: 1.2; }
  .cell .ch { min-width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.8); padding: 0 calc(var(--u) * .6); font-size: calc(var(--u) * 3.9); line-height: 1; background: var(--card); border: 3px solid var(--line); border-radius: calc(var(--u) * .9); }
  .cell .ch[aria-expanded="true"] { border-color: var(--accent); background: var(--k-init); color: var(--ink); }
  :root[data-contrast="high"] .cell .ch[aria-expanded="true"] { background: #000; border-color: var(--accent); }
  .cell .ch.none { border-style: dashed; font-size: calc(var(--u) * 3); }
  .cell.punct .ch { border: 0; min-width: calc(var(--u) * 3.2); cursor: default; }
  .empty { color: var(--muted); align-self: center; padding: 0 calc(var(--u) * .5); }
  .sentence { border-top: 2px dashed var(--line); margin-top: calc(var(--u) * .3); padding-top: calc(var(--u) * .3); font-size: calc(var(--u) * 2); min-height: 1.5em; word-break: break-all; }
  .sentence span { font-size: calc(var(--u) * 1.1); color: var(--muted); margin-right: .6em; }

  /* 選字列（固定高度，避免版面跳動） */
  .cands { display: flex; align-items: center; gap: calc(var(--u) * .6); height: calc(var(--u) * 5.8); background: var(--card); border: 2px solid var(--line); border-radius: calc(var(--u) * 1); padding: 0 calc(var(--u) * 1.2); overflow-x: auto; white-space: nowrap; }
  .cands .lab { color: var(--muted); font-size: calc(var(--u) * 1.15); flex: none; }
  .cand { flex: none; min-width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.4); font-size: calc(var(--u) * 2.8); background: var(--card); border: 3px solid var(--line); border-radius: calc(var(--u) * .8); }
  .cand[aria-current="true"] { border-color: var(--accent); border-width: 4px; }
  .cand.far { border-style: dashed; }
  .cands .sep { flex: none; width: 2px; height: 60%; background: var(--line); margin: 0 calc(var(--u) * .4); }
  .cands .close { flex: none; margin-left: auto; min-height: calc(var(--u) * 4.4); padding: 0 calc(var(--u) * 1.2); border-radius: calc(var(--u) * .8); border: 2px solid var(--line); background: var(--card); }

  /* 注音鍵盤：依電腦鍵盤的標準注音排列（11 欄） */
  .kbd { display: grid; grid-template-columns: repeat(11, 1fr); grid-auto-rows: calc(var(--u) * 4.3); gap: calc(var(--u) * .6); }
  .key { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; background: var(--k-act); border: 3px solid var(--k-act-b); border-radius: calc(var(--u) * .9); box-shadow: 0 calc(var(--u) * .25) 0 var(--k-act-b); font-size: calc(var(--u) * 2.9); color: var(--ink); padding: 0; }
  .key:active, .key.pressed { transform: translateY(calc(var(--u) * .2)); box-shadow: 0 calc(var(--u) * .05) 0 var(--k-act-b); }
  .key.i { background: var(--k-init); border-color: var(--k-init-b); box-shadow: 0 calc(var(--u) * .25) 0 var(--k-init-b); }
  .key.m { background: var(--k-med); border-color: var(--k-med-b); box-shadow: 0 calc(var(--u) * .25) 0 var(--k-med-b); }
  .key.f { background: var(--k-fin); border-color: var(--k-fin-b); box-shadow: 0 calc(var(--u) * .25) 0 var(--k-fin-b); }
  .key.t { background: var(--k-tone); border-color: var(--k-tone-b); box-shadow: 0 calc(var(--u) * .25) 0 var(--k-tone-b); }
  .key[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .key .sub { font-size: calc(var(--u) * 1.05); margin-top: calc(var(--u) * .15); }
  .key .pc { position: absolute; right: calc(var(--u) * .5); bottom: calc(var(--u) * .25); font-size: calc(var(--u) * .95); font-family: ui-monospace, Consolas, monospace; opacity: .85; }
  .key.act { font-size: calc(var(--u) * 1.8); font-weight: 700; }
  .key.act .big { font-size: calc(var(--u) * 2.2); }
  .key.speak { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 calc(var(--u) * .25) 0 rgba(0,0,0,.45); }
  .key:disabled { opacity: .5; cursor: not-allowed; }
  .key.space { font-size: calc(var(--u) * 1.8); font-weight: 700; }

  .legend { display: flex; gap: calc(var(--u) * 1.4); flex-wrap: wrap; font-size: calc(var(--u) * 1); color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); border: 3px solid; border-radius: 4px; vertical-align: -.2em; margin-right: .3em; }

  /* 設定面板 */
  .examples { display: flex; gap: calc(var(--u) * .6); flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (forced-colors: active) { .key, .cell .ch, .cand { border: 2px solid ButtonText; } .key[aria-pressed="true"] { forced-color-adjust: none; background: Highlight; color: HighlightText; } }

  :root[data-layout="portrait"] .display { grid-template-columns: 1fr; min-height: calc(var(--u) * 34); }
  :root[data-layout="portrait"] .panel:last-child { min-height: calc(var(--u) * 16); }
  :root[data-device="phone"] .pc, :root[data-device="tablet"] .pc { display: none; }
  :root[data-device="phone"] .key:not(.act):not(.space) { font-size: calc(var(--u) * 2.3); }
  :root[data-device="phone"] header .hint.grow { display: none; }
  :root[data-device="phone"] header.top h1 { font-size: calc(var(--u) * 1.8); }

  /* 設定對話框 */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }
  .backdrop[hidden] { display: none; }
  .settings { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94vw, calc(var(--u) * 78)); max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--card); color: var(--ink); border: 3px solid var(--line); border-radius: calc(var(--u) * 1.2); padding: calc(var(--u) * 1.4); box-shadow: 0 12px 48px rgba(0,0,0,.5); }
  .settings[hidden] { display: none; }
  .set-head { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-bottom: calc(var(--u) * 1); }
  .set-head h2 { margin: 0; font-size: calc(var(--u) * 2); }
  .set-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--u) * 24)), 1fr)); gap: calc(var(--u) * 1.2); }
  .settings fieldset { border: 2px solid var(--line); border-radius: calc(var(--u) * .9); margin: 0; padding: calc(var(--u) * .6) calc(var(--u) * 1) calc(var(--u) * 1); min-width: 0; }
  .settings legend { font-weight: 700; padding: 0 .4em; font-size: calc(var(--u) * 1.4); }
  .settings .note { color: var(--muted); font-size: calc(var(--u) * 1); margin: calc(var(--u) * .5) 0 0; }
  .seg { display: flex; gap: calc(var(--u) * .5); flex-wrap: wrap; }
  .seg label { position: relative; flex: 1 1 auto; }
  .seg input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .seg span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: calc(var(--u) * 3.6); padding: 0 calc(var(--u) * 1); border: 2px solid var(--line); border-radius: calc(var(--u) * .7); background: var(--card); font-size: calc(var(--u) * 1.3); }
  .seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .seg input:checked + span::before { content: "✓ "; white-space: pre; }
  .seg input:focus-visible + span { outline: calc(var(--u) * .3) solid var(--focus); outline-offset: calc(var(--u) * .15); box-shadow: 0 0 0 calc(var(--u) * .5) var(--focus2); }
  .seg input:disabled + span { opacity: .5; }
  .settings .voice-row { display: grid; grid-template-columns: 1fr; gap: calc(var(--u) * .5); }
  .settings label.lb { display: block; font-size: calc(var(--u) * 1.15); }
  .settings select { width: 100%; min-height: calc(var(--u) * 3.6); background: var(--card); border: 2px solid var(--line); border-radius: calc(var(--u) * .6); padding: 0 .5em; }
  .settings input[type=range] { width: 100%; height: calc(var(--u) * 3); accent-color: var(--accent); }
</style>
</head>
<body>
<a class="skip" href="#keyboard" data-i18n="skipKb"></a>
<a class="skip" href="#result-h" data-i18n="skipRes"></a>

<header class="top">
  <h1 data-i18n="title"></h1>
  <p class="hint grow" style="margin:0" data-i18n="hint"></p>
  <div class="examples" role="group" data-i18n-label="exLabel" id="examples"></div>
  <button class="tbtn" id="b-settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings" data-i18n="btnSettings"></button>
</header>

<div class="backdrop" id="backdrop" hidden></div>
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="set-h" hidden>
  <div class="set-head">
    <h2 id="set-h" data-i18n="setTitle"></h2>
    <button class="tbtn" id="b-close-settings" data-i18n="close"></button>
  </div>
  <div class="set-groups" id="set-groups"></div>
  <fieldset style="margin-top: calc(var(--u) * 1.2)" class="voice-set">
    <legend data-i18n="voiceSec"></legend>
    <div class="voice-row">
      <label class="lb" for="voice" data-i18n="voice"></label><select id="voice"></select>
      <label class="lb" for="rate"><span data-i18n="rate"></span>：<span id="rate-v">0.9</span></label><input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9">
      <label class="lb" for="pitch"><span data-i18n="pitch"></span>：<span id="pitch-v">1.0</span></label><input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1">
      <div><button class="tbtn" id="b-test" data-i18n="test"></button></div>
    </div>
  </fieldset>
</div>

<main id="main">
  <div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="display">
    <section class="panel" aria-labelledby="buf-h">
      <h2 id="buf-h" data-i18n="bufTitle"></h2>
      <div class="buffer" id="buffer"></div>
      <div class="speech-mini">
        <div class="status" id="status" role="status"></div>
        <div class="legend" aria-hidden="true">
          <span><i style="border-color:var(--k-init-b);background:var(--k-init)"></i><span data-i18n="catI"></span></span>
          <span><i style="border-color:var(--k-med-b);background:var(--k-med)"></i><span data-i18n="catM"></span></span>
          <span><i style="border-color:var(--k-fin-b);background:var(--k-fin)"></i><span data-i18n="catF"></span></span>
          <span><i style="border-color:var(--k-tone-b);background:var(--k-tone)"></i><span data-i18n="catT"></span></span>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="result-h">
      <h2 id="result-h" data-i18n="resTitle"></h2>
      <div class="result" id="result" role="group" data-i18n-label="resGroup" tabindex="-1"></div>
      <div class="sentence" id="sentence"></div>
    </section>
  </div>

  <div class="cands" id="cands" role="group" data-i18n-label="candsGroup"></div>

  <div id="keyboard" tabindex="-1" role="group" data-i18n-label="kbdLabel">
    <div class="kbd" id="kbd"></div>
  </div>
</main>

<script>

/* 聲調寫法：一聲不加符號，ˊ ˇ ˋ 放後面，輕聲 ˙ 放最前面 */

ㄅㄧㄣ 賓濱
ㄅㄧㄥ 冰兵
ㄅㄧㄥˇ 餅
ㄅㄧㄥˋ 病並
ㄅㄨˋ 不步部布
ㄅㄨˇ 補捕
ㄅㄨˊ 餔
ㄅㄛ 波播
ㄅㄛˊ 伯博薄
ㄆㄚ 趴
ㄆㄚˊ 爬

/* ───────── 解析字典 ───────── */
const CHARS = new Map();
for (const line of CHAR_DATA.trim().split('\n')) {
  const sp = line.indexOf(' ');
  if (sp < 0) continue;
  const key = line.slice(0, sp), list = CHARS.get(key) || [];
  for (const c of line.slice(sp + 1).trim()) if (!list.includes(c)) list.push(c);
  CHARS.set(key, list);
}
const WORDS = new Map();
let MAX_WORD = 1;
for (const line of WORD_DATA.trim().split('\n')) {
  const [k, w] = line.split('|');
  const n = k.split(' ').length;
  if (!w || [...w].length !== n) { console.warn('詞條音節數與字數不符：', line); continue; }
  WORDS.set(k, [...w]);
  MAX_WORD = Math.max(MAX_WORD, n);
}

/* ───────── 鍵盤定義：依電腦鍵盤的標準注音排列 ───────── */

const LAYOUT = [
  { pc: '1234567890-', keys: ['ㄅ', 'ㄉ', 'ˇ', 'ˋ', 'ㄓ', 'ˊ', '˙', 'ㄚ', 'ㄞ', 'ㄢ', 'ㄦ'] },

/* ───────── 狀態 ───────── */
let buf = { i: '', m: '', f: '' };
let items = [];          // {base, tone} 或 {punct}
let overrides = {};      // index -> 使用者選的字
let selected = -1;       // 正在選字的索引

const $ = id => document.getElementById(id);
const root = document.documentElement;
const keyOf = it => it.tone === '˙' ? '˙' + it.base : it.base + (it.tone === 'ˉ' ? '' : it.tone);

let keyEls = {};         // 符號 → 按鈕

let liveTimer;
function announce(msg) {

/* ───────── 使用者設定 ───────── */

  ['contrast',   ['off', 'on']],

/* 依裝置與螢幕方向決定實際版面 */

  const lay = S.layout !== 'auto' ? S.layout : (w < h ? 'portrait' : 'landscape');

/* 音效（Web Audio 短音，不需要音檔） */
let actx;

    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);

}

  key:  () => beep(660, 0.05),
  tone: () => { beep(784, 0.07); beep(1047, 0.1, 'sine', 0.09, 0.07); },
  del:  () => beep(330, 0.07, 'triangle'),
  err:  () => beep(200, 0.16, 'square', 0.05),
  pick: () => beep(880, 0.07),
  on:   () => beep(988, 0.08),
};

/* 全螢幕 */
function setFullscreen(on) {
  const el = root;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  try {
    const p = on ? req && req.call(el) : (document.fullscreenElement || document.webkitFullscreenElement) && exit && exit.call(document);
    if (p && p.catch) p.catch(() => syncFullscreen());
  } catch (e) { syncFullscreen(); }
}

  if (!$('settings').hidden) renderSettings();
}
document.addEventListener('fullscreenchange', syncFullscreen);

function setSetting(id, val) {
  S[id] = val;
  if (id === 'fullscreen') setFullscreen(val === 'on');
  else if (id === 'sound') { if (val === 'on') sfx.on(); }
  else if (id === 'lang') { lang = val; applyLang(); }
  else applyAppearance();
  saveSettings();
  announce(t('a_setting', t('g_' + id), optLabel(id, val)));
}

/* 設定視窗：每一項都是一組單選按鈕（原生 radio，方向鍵即可切換） */
function renderSettings() {
  const host = $('set-groups');
  const activeId = host.contains(document.activeElement) ? document.activeElement.id : null;
  host.innerHTML = '';
  for (const [id, opts] of SET_DEF) {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend');
    lg.textContent = t('g_' + id);
    const seg = document.createElement('div');
    seg.className = 'seg';
    for (const o of opts) {
      const lab = document.createElement('label');
      const inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'set-' + id; inp.value = o; inp.id = `set-${id}-${o}`;
      inp.checked = S[id] === o;
      if (id === 'fullscreen' && !fsSupported()) inp.disabled = true;
      inp.onchange = () => setSetting(id, o);
      const sp = document.createElement('span');
      sp.textContent = optLabel(id, o);
      lab.append(inp, sp);
      seg.appendChild(lab);
    }
    fs.append(lg, seg);
    const note = { sound: 'n_sound', layout: 'n_layout' }[id] || (id === 'fullscreen' && !fsSupported() ? 'n_fs' : null);
    if (note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = t(note); fs.appendChild(p); }
    host.appendChild(fs);
  }

let settingsOpener = null;
function toggleSettings(open) {
  $('settings').hidden = !open;
  $('backdrop').hidden = !open;
  $('b-settings').setAttribute('aria-expanded', String(open));
  if (open) {
    settingsOpener = document.activeElement;
    renderSettings();
    const first = $('set-groups').querySelector('input:checked:not(:disabled)') || $('b-close-settings');
    first.focus();
    announce(t('a_setOpen'));
  } else {
    (settingsOpener && document.contains(settingsOpener) ? settingsOpener : $('b-settings')).focus();
    announce(t('a_setClose'));
  }
}
$('b-settings').onclick = () => toggleSettings($('settings').hidden);
$('b-close-settings').onclick = () => toggleSettings(false);

/* 對話框內 Tab 循環，不會跑到背後 */
$('settings').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...$('settings').querySelectorAll('button, select, input:not(:disabled)')].filter(x => x.offsetParent !== null);
  // 同一組 radio 只算一個停駐點
  const stops = f.filter(x => x.type !== 'radio' || x.checked || !f.some(y => y.name === x.name && y.checked));
  if (!stops.length) return;
  const a = stops[0], z = stops[stops.length - 1];
  if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
  else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
});

/* ───────── 注音 → 國字 ───────── */
function candidatesFor(it) {
  const exact = CHARS.get(keyOf(it)) || [];
  const others = [];
  for (const tn of ['ˉ', 'ˊ', 'ˇ', 'ˋ', '˙']) {
    if (tn === it.tone) continue;
    for (const c of CHARS.get(keyOf({ base: it.base, tone: tn })) || [])
      if (!exact.includes(c) && !others.includes(c)) others.push(c);
  }
  return { exact, others };
}

/* 先做最長詞彙比對，其餘取最常用字，最後套用使用者的換字 */
function convert() {
  const out = new Array(items.length).fill(null);
  let i = 0;
  while (i < items.length) {
    if (items[i].punct) { out[i] = items[i].punct; i++; continue; }
    let hit = false;
    for (let len = Math.min(MAX_WORD, items.length - i); len >= 2 && !hit; len--) {
      const seg = items.slice(i, i + len);
      if (seg.some(s => s.punct)) continue;
      const w = WORDS.get(seg.map(keyOf).join(' '));
      if (w) { w.forEach((c, k) => out[i + k] = c); i += len; hit = true; }
    }
    if (!hit) { out[i] = candidatesFor(items[i]).exact[0] || null; i++; }
  }
  for (const [idx, c] of Object.entries(overrides)) if (items[idx]) out[idx] = c;
  return out;
}

/* ───────── 畫面 ───────── */
function renderBuffer() {
  const el = $('buffer');
  el.innerHTML = '';
  const any = ['i', 'm', 'f'].some(k => buf[k]);
  for (const k of ['i', 'm', 'f']) if (buf[k]) {
    const s = document.createElement('span');
    s.className = 'sym ' + k; s.textContent = buf[k];
    s.setAttribute('role', 'img'); s.setAttribute('aria-label', t('kSym', buf[k], catName(k)));
    el.appendChild(s);
  }
  const h = document.createElement('span');
  h.className = 'hint';
  h.textContent = any ? t('bufNext') : t('bufEmpty');
  el.appendChild(h);
  for (const [s, b] of Object.entries(keyEls)) b.setAttribute('aria-pressed', String(buf[catOf(s)] === s));
}

function renderResult(focusIdx) {
  const out = convert();
  const box = $('result');
  box.innerHTML = '';
  if (!items.length) box.innerHTML = `<span class="empty">${t('emptyRes')}</span>`;
  items.forEach((it, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (it.punct) {
      cell.classList.add('punct');
      cell.innerHTML = `<div class="zy" aria-hidden="true">&nbsp;</div><div class="ch" role="img" aria-label="${t('kPunct', it.punct)}">${it.punct}</div>`;
    } else {
      const zy = document.createElement('div');

function renderCands(out) {
  const box = $('cands');
  box.innerHTML = '';
  if (selected < 0 || !items[selected] || items[selected].punct) {
    selected = -1;
    box.innerHTML = `<span class="lab">${t('candsIdle')}</span>`;
    return;
  }
  const it = items[selected], { exact, others } = candidatesFor(it);
  const lab = document.createElement('span');
  lab.className = 'lab'; lab.textContent = t('candLab', zhuyinOf(it));
  box.appendChild(lab);

    const b = document.createElement('button');
    b.className = 'cand' + (far ? ' far' : '');

      announce(t('a_picked', c));
    };
    box.appendChild(b);
  });
  add(exact, false);
  if (!exact.length) { const n = document.createElement('span'); n.className = 'lab'; n.textContent = t('candNone'); box.appendChild(n); }
  if (others.length) {
    const sep = document.createElement('span'); sep.className = 'sep'; sep.setAttribute('role', 'presentation');
    const l2 = document.createElement('span'); l2.className = 'lab'; l2.textContent = t('candOthers');
    box.append(sep, l2); add(others, true);

}

  renderResult(refocus ? i : undefined);

/* ───────── 輸入動作 ───────── */
function addSymbol(s) {
  const c = catOf(s);
  buf[c] = buf[c] === s ? '' : s;
  renderBuffer(); sfx.key();
  announce(buf[c] ? t('a_sym', s, catName(c), bufBase()) : t('a_cancel', s));
}

  const it = { base, tone };
  items.push(it);
  buf = { i: '', m: '', f: '' };
  selected = -1;
  renderBuffer(); renderResult(); sfx.tone();
  announce(t('a_commit', zhuyinOf(it), convert()[items.length - 1]));

  if (items.length) {
    const it = items.pop(); delete overrides[items.length]; selected = -1; renderResult();
    sfx.del(); announce(t('a_del', it.punct || zhuyinOf(it)));
  } else { sfx.err(); announce(t('a_nodel')); }
}
function clearAll(silent) {
  buf = { i: '', m: '', f: '' }; items = []; overrides = {}; selected = -1;
  stopSpeak(); renderBuffer(); renderResult();
  if (!silent) { sfx.del(); announce(t('a_cleared')); }
}

/* ───────── 建立鍵盤 ───────── */
let grid = [];   // {el, row, c0, c1}
function buildKeys() {
  const host = $('kbd');
  host.innerHTML = ''; grid = []; keyEls = {};
  LAYOUT.forEach((row, r) => {
    let col = 1;
    row.keys.forEach((k, i) => {
      const span = SPAN[k] || 1;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'key';
      b.style.gridColumn = `${col} / span ${span}`;
      b.style.gridRow = r + 1;
      const pc = row.pc[i] ? `<span class="pc" aria-hidden="true">${row.pc[i].toUpperCase()}</span>` : '';
      if (k === '@back') {
        b.classList.add('act');
        b.innerHTML = `<span class="big">⌫</span><span class="sub">${t('kBack')}</span>`;
        b.setAttribute('aria-label', t('kBackFull')); b.onclick = () => backspace();
      } else if (k === '@clear') {
        b.classList.add('act'); b.textContent = t('kClear');
        b.setAttribute('aria-label', t('kClearFull')); b.onclick = () => clearAll();
      } else if (k === '@stop') {
        b.classList.add('act'); b.textContent = t('kStop');
        b.setAttribute('aria-label', t('kStopFull'));
        b.onclick = () => { stopSpeak(); setStatus('st_stopped'); announce(t('a_stopped')); };
      } else if (k === '@space') {
        b.classList.add('space', 't'); b.textContent = t('kSpace');
        b.setAttribute('aria-label', t('kSpaceFull')); b.onclick = () => commitTone('ˉ');
      } else if (k === '@speak') {
        b.classList.add('act', 'speak'); b.dataset.act = 'speak'; b.textContent = t('kSpeak');
        b.setAttribute('aria-label', t('kSpeakFull')); b.onclick = () => speakAll();
      } else if (TONE_INFO[k]) {
        b.classList.add('t');
        b.innerHTML = `${k}<span class="sub">${t(TONE_INFO[k][0])}</span>${pc}`;
        b.setAttribute('aria-label', t('kTone', t(TONE_INFO[k][0])));
        b.onclick = () => commitTone(k);
      } else if ('，。？！'.includes(k)) {
        b.classList.add('act');
        b.innerHTML = `<span class="big">${k}</span>`;
        b.setAttribute('aria-label', t('kPunct', k));
        b.onclick = () => addPunct(k);
      } else {
        const c = catOf(k);
        b.classList.add(c);
        b.innerHTML = `${k}${pc}`;
        b.setAttribute('aria-label', t('kSym', k, catName(c)));
        b.setAttribute('aria-pressed', 'false');
        b.onclick = () => addSymbol(k);
        keyEls[k] = b;
      }
      b.tabIndex = -1;
      host.appendChild(b);
      grid.push({ el: b, row: r, c0: col, c1: col + span - 1 });
      col += span;
    });
  });
  grid[0].el.tabIndex = 0;
}

/* 方向鍵在鍵盤內移動（roving tabindex），避免要 Tab 50 次 */
$('kbd').addEventListener('focusin', e => {
  const g = grid.find(x => x.el === e.target);
  if (!g) return;
  grid.forEach(x => x.el.tabIndex = -1);
  g.el.tabIndex = 0;
});
$('kbd').addEventListener('keydown', e => {
  const i = grid.findIndex(x => x.el === document.activeElement);
  if (i < 0) return;
  const cur = grid[i];
  let next = null;
  const inRow = grid.filter(x => x.row === cur.row);
  if (e.key === 'ArrowRight') next = grid[i + 1];
  else if (e.key === 'ArrowLeft') next = grid[i - 1];
  else if (e.key === 'Home') next = inRow[0];
  else if (e.key === 'End') next = inRow[inRow.length - 1];
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const r = cur.row + (e.key === 'ArrowDown' ? 1 : -1);
    next = grid.find(x => x.row === r && x.c0 <= cur.c0 && x.c1 >= cur.c0);
  } else return;
  e.preventDefault();
  if (next) next.el.focus();
});

/* 實體鍵盤：標準注音鍵位 */
function flash(el) { if (!el) return; el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 140); }
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('settings').hidden) { if (e.key === 'Escape') toggleSettings(false); return; }
  if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Escape') { if (selected >= 0) closeCands(true); return; }
  const onButton = e.target.tagName === 'BUTTON';
  if ((e.key === ' ' || e.key === 'Enter') && onButton) return;   // 交給按鈕原本的行為
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
  if (e.key === 'Enter') { e.preventDefault(); speakAll(); return; }
  const k = e.key.toLowerCase();
  if (TONE_KEYS[e.key]) { e.preventDefault(); commitTone(TONE_KEYS[e.key]); return; }
  if (KEY2SYM[k]) { e.preventDefault(); addSymbol(KEY2SYM[k]); flash(keyEls[KEY2SYM[k]]); }
});

/* ───────── Web Speech API ───────── */
const synth = window.speechSynthesis;
let voices = [];
let statusState = { k: '', a: [], cls: '' };
function setStatus(k, a = [], cls = '') { statusState = { k, a, cls }; refreshStatus(); }
function refreshStatus() {
  const s = $('status');
  s.textContent = statusState.k ? t(statusState.k, ...statusState.a) : '';
  s.className = 'status ' + statusState.cls;
}

function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices();
  const zh = all.filter(v => /^zh/i.test(v.lang) || /chinese|中文|國語|台灣|mandarin/i.test(v.name));
  voices = zh.length ? zh : all;
  voices.sort((a, b) => (/zh[-_]TW/i.test(b.lang) - /zh[-_]TW/i.test(a.lang)));
  const sel = $('voice'), prev = sel.value;
  sel.innerHTML = '';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = `${v.name}（${v.lang}）`;
    sel.appendChild(o);
  });
  if (prev && sel.querySelector(`option[value="${prev}"]`)) sel.value = prev;
  if (!voices.length) setStatus('st_novoice', [], 'warn');
  else if (!zh.length) setStatus('st_nozh', [], 'warn');
  else setStatus('st_loaded', [zh.length], 'ok');
}

function speak(text, quiet) {
  if (!synth) { setStatus('st_nosupport', [], 'warn'); return; }
  if (!text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices[$('voice').value];
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
  u.rate = parseFloat($('rate').value);
  u.pitch = parseFloat($('pitch').value);
  if (!quiet) {
    u.onstart = () => setStatus('st_speaking', [text], 'ok');
    u.onend = () => setStatus('st_done');
    u.onerror = ev => { if (ev.error !== 'canceled' && ev.error !== 'interrupted') setStatus('st_fail', [ev.error], 'warn'); };
  }
  synth.speak(u);
}
function speakAll() {
  const out = convert();
  const text = out.map(c => c || '').join('');
  const missing = out.filter((c, i) => !c && !items[i].punct).length;
  if (!text.replace(/[，。？！]/g, '')) { setStatus('st_nochars', [], 'warn'); announce(t('st_nochars')); return; }
  speak(text);
  if (missing) setTimeout(() => setStatus('st_missing', [text, missing], 'warn'), 50);
  announce(t('a_speaking'));
}
function stopSpeak() { if (synth) synth.cancel(); }

$('b-test').onclick = () => speak(t('testText'));
$('rate').oninput = e => $('rate-v').textContent = (+e.target.value).toFixed(1);
$('pitch').oninput = e => $('pitch-v').textContent = (+e.target.value).toFixed(1);

/* ───────── 範例 ───────── */
const EXAMPLES = [
  ['你好', 'Hello', 'ㄋㄧˇ ㄏㄠˇ'],
  ['我愛台灣', 'I love Taiwan', 'ㄨㄛˇ ㄞˋ ㄊㄞˊ ㄨㄢ'],
  ['今天天氣很好', 'The weather is nice today', 'ㄐㄧㄣ ㄊㄧㄢ ㄊㄧㄢ ㄑㄧˋ ㄏㄣˇ ㄏㄠˇ'],
];
function buildExamples() {
  const host = $('examples');
  host.innerHTML = '';
  for (const [zhText, enText, zy] of EXAMPLES) {
    const b = document.createElement('button');
    b.className = 'tbtn'; b.textContent = zhText;
    b.setAttribute('aria-label', lang === 'zh' ? `範例：${zhText}` : `Example: ${enText} (${zhText})`);
    b.onclick = () => {
      clearAll(true);
      for (const s of zy.split(' ')) {
        const neutral = s.startsWith('˙'), m = s.match(/[ˊˇˋ]$/);
        items.push({ base: s.replace(/^˙|[ˊˇˋ]$/g, ''), tone: neutral ? '˙' : m ? m[0] : 'ˉ' });
      }
      renderResult(); sfx.tone();
      announce(t('a_example', convert().join('')));
    };
    host.appendChild(b);
  }
}

/* ───────── 語言切換與初始化 ───────── */
function applyLang() {
  root.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-label]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nLabel)));
  buildKeys(); renderBuffer(); renderResult(); buildExamples();
  if (!$('settings').hidden) renderSettings();
  refreshStatus();
}

loadSettings();
lang = S.lang;
if (window.matchMedia && matchMedia('(prefers-contrast: more)').matches && S.contrast === 'off') S.contrast = 'on';
applyAppearance();
applyLang();
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
else setStatus('st_nosupport', [], 'warn');
</script>
